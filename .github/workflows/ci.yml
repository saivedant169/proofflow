name: Verify ProofFlow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra test --extra benchmark --extra mcp
      - name: Unit tests without model credentials
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and typecheck the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Start pinned HydraDB
        run: |
          uv run python scripts/init_local.py
          docker compose up -d
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18443/healthz; then exit 0; fi
            sleep 1
          done
          docker compose logs hydradb
          exit 1
      - name: Verify native traversal and persistent database restart
        run: uv run python scripts/hydra_smoke.py --restart --output evidence/ci_hydra_smoke.json
      - name: Verify executed refresh and currentness
        run: uv run python scripts/core_smoke.py --output evidence/ci_core_smoke.json
      - name: Verify local MCP client and durable workspaces
        run: uv run --extra mcp python scripts/mcp_smoke.py --output evidence/ci_mcp
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            evidence/ci_*.json
            evidence/ci_mcp/*.json
      - name: Stop this job's services
        if: always()
        run: docker compose down
