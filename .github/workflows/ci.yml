name: Verify ProofFlow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Match the checked-in Playwright 1.56.1 / Chromium build's supported OS.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --extra test --extra benchmark --extra mcp
      - name: Unit tests without model credentials
        run: uv run pytest -q
      - name: Audit saved model results without models or services
        run: python3 scripts/audit_model_comparison_v4.py .
      - name: Verify the public evidence download and publication inventory
        run: python3 scripts/build_public_evidence.py --check
      - name: Verify the public delivery evidence download
        run: python3 scripts/build_delivery_evidence.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and typecheck the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Start pinned HydraDB
        run: |
          uv run python scripts/init_local.py
          docker compose up -d
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18443/healthz; then exit 0; fi
            sleep 1
          done
          docker compose logs hydradb
          exit 1
      - name: Verify native traversal and persistent database restart
        run: uv run python scripts/hydra_smoke.py --restart --output evidence/ci_hydra_smoke.json
      - name: Verify executed refresh and currentness
        run: uv run python scripts/core_smoke.py --output evidence/ci_core_smoke.json
      - name: Verify local MCP client and durable workspaces
        run: uv run --extra mcp python scripts/mcp_smoke.py --output evidence/ci_mcp
      - name: Verify recovery after an interrupted CSV update
        env:
          PROOFFLOW_HYDRA_TOKEN_FILE: ${{ github.workspace }}/.state/hydra-token
        run: uv run python scripts/recovery_probe.py --output evidence/ci_recovery
      - name: Install pinned Chromium for browser acceptance
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify browser CSV workflows and arithmetic negative control
        working-directory: frontend
        env:
          PROOFFLOW_E2E_PYTHON: ${{ github.workspace }}/.venv/bin/python
          PROOFFLOW_HYDRA_TOKEN_FILE: ${{ github.workspace }}/.state/hydra-token
          PROOFFLOW_E2E_OUTPUT_DIR: ${{ runner.temp }}/proofflow-browser-e2e
        run: |
          npm run test:e2e
          npm run test:e2e:negative
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            evidence/ci_*.json
            evidence/ci_mcp/*.json
            evidence/ci_recovery/summary.json
            evidence/ci_recovery/run-manifest.json
            evidence/ci_recovery/kill-result.json
            evidence/ci_recovery/parent-observed-boundary.json
            evidence/ci_recovery/blocked-recovery-actions.json
            evidence/ci_recovery/lifecycle-accounting.json
            evidence/ci_recovery/*-semantic-lineage.json
            evidence/ci_recovery/arithmetic-*.jsonl
            ${{ runner.temp }}/proofflow-browser-e2e/*/assertions.jsonl
            ${{ runner.temp }}/proofflow-browser-e2e/*/negative-control.json
      - name: Stop this job's services
        if: always()
        run: docker compose down
