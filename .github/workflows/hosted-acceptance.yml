name: Hosted ProofFlow acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-proofflow-acceptance
  cancel-in-progress: false

jobs:
  csv-browser:
    name: Public HTTPS browser and CSV checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the checked-out frontend with locked dependencies
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Locate Chrome or install it through Playwright
        working-directory: frontend
        run: |
          if ! command -v google-chrome >/dev/null; then
            npm exec -- playwright install chrome
          fi
          google-chrome --version
      - name: Exercise the public application in the runner image's Chrome
        env:
          PROOFFLOW_HOSTED_OUTPUT_DIR: ${{ runner.temp }}/proofflow-hosted
        run: |
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy \
            node scripts/hosted_browser_acceptance.mjs
      - name: Preserve browser receipt and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-browser-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proofflow-hosted/hosted-browser-*/receipt.json
            ${{ runner.temp }}/proofflow-hosted/hosted-browser-*/*.png
          if-no-files-found: error

  guided-http:
    name: Public HTTPS guided HTTP smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked HTTP dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --no-dev --no-install-project
      - name: Run the guided HTTP checks and write a sanitized receipt
        env:
          PROOFFLOW_HOSTED_OUTPUT_DIR: ${{ runner.temp }}/proofflow-guided
        run: |
          umask 077
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy \
            uv run --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          origin = "https://proofflow.arnavbule.in"
          started_at_utc = datetime.now(timezone.utc).isoformat()
          expected_checks = (
              "health_reads_real_hydra", "built_interface_served", "compiled_assets_load", "unknown_api_is_not_spa",
              "initial_actual_values", "changed_claims_withheld", "native_impact_four_artifacts", "correct_refreshed_values",
              "four_actual_tools_and_support_preserved", "independent_refresh_parity", "missing_source_refresh_refused",
              "missing_source_never_serves_current_revenue", "reset_recovers_new_generation",
          )
          with tempfile.TemporaryDirectory(prefix="proofflow-guided-private-") as private_dir:
              raw = Path(private_dir, "smoke.json")
              try:
                  smoke_exit_code = subprocess.run(
                      [sys.executable, "scripts/deployment_smoke.py", "--url", origin, "--output", str(raw)],
                      stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                      timeout=180, check=False,
                  ).returncode
              except subprocess.TimeoutExpired:
                  smoke_exit_code = 124
              try:
                  result = json.loads(raw.read_text())
              except (OSError, ValueError):
                  result = {}
          observed = result.get("checks", {})
          checks = {name: observed.get(name) if isinstance(observed.get(name), bool) else None for name in expected_checks}
          env = os.environ
          passed = (smoke_exit_code == 0 and result.get("passed") is True
                    and env["RUNNER_ENVIRONMENT"] == "github-hosted" and env["ImageOS"] == "ubuntu24"
                    and all(value is True for value in checks.values()))
          receipt = {
              "schema_version": 1, "scope": "Guided HTTP fixture", "passed": passed,
              "origin": origin, "source_sha": env["GITHUB_SHA"],
              "run_id": env["GITHUB_RUN_ID"], "run_attempt": env["GITHUB_RUN_ATTEMPT"],
              "runner_environment": env["RUNNER_ENVIRONMENT"], "runner_image_os": env["ImageOS"],
              "started_at_utc": started_at_utc, "finished_at_utc": datetime.now(timezone.utc).isoformat(),
              "smoke_exit_code": smoke_exit_code,
              "checks": checks, "passed_checks": sum(value is True for value in checks.values()),
              "check_count": len(expected_checks),
              "expected_fixture": {"initial": [556500, 209000, 2], "withheld": [None, None, 2],
                                   "refreshed": [575500, 228000, 2],
                                   "units": ["company USD cents", "EU USD cents", "EU support tickets"]},
          }
          output = Path(env["PROOFFLOW_HOSTED_OUTPUT_DIR"])
          output.mkdir(parents=True, exist_ok=True)
          (output / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(f'Guided HTTP checks passed: {receipt["passed_checks"]}/{receipt["check_count"]}')
          raise SystemExit(0 if passed else 1)
          PY
      - name: Preserve guided HTTP receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-guided-http-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proofflow-guided/receipt.json
          if-no-files-found: error
