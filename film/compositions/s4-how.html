      <script>
        (() => {
          const S = "s4";
          const tl = gsap.timeline({ paused: true });
          const at = (word, nth = 1, off = 0) => FILM.at(S, word, nth, off);
          const end = FILM.section(S).duration;
          const q = (id) => document.getElementById(id);
          const wipe = (target, t, d = 0.55, r = 14) =>
            tl.fromTo(
              target,
              { clipPath: `inset(0% 100% 0% 0% round ${r}px)` },
              { clipPath: `inset(0% 0% 0% 0% round ${r}px)`, duration: d, ease: "power2.out" },
              t,
            );
          const show = (target, t, d = 0.3) => tl.fromTo(target, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const hide = (target, t, d = 0.3) => tl.fromTo(target, { opacity: 1 }, { opacity: 0, duration: d, ease: "power1.in" }, t);
          const pop = (target, t) =>
            tl.fromTo(target, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" }, t);

          // Everything that only appears on a beat starts hidden (CSS .s4-late).
          ["s4-st-a", "s4-st-b", "s4-st-c", "s4-st-d", "s4-fr-a", "s4-fr-b", "s4-fr-c", "s4-fr-d"].forEach((id) => {
            const p = q(id);
            p.setAttribute("pathLength", "1");
            p.setAttribute("stroke-dasharray", "1");
            p.setAttribute("stroke-dashoffset", "1");
          });

          // ---- 0: title stretches in on the width axis -------------------------------------------
          tl.fromTo("#s4-title", { "--s4-w": 60, opacity: 0 }, { "--s4-w": 120, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.1);

          // The world follows the chain as it grows: source centred, then receipt, then the whole chain.
          const tTool = at("tool");
          const tResult = at("result");
          tl.fromTo("#s4-world", { x: 420 }, { x: 210, duration: 0.9, ease: "power2.inOut" }, tTool - 0.35);
          tl.fromTo("#s4-world", { x: 210 }, { x: 0, duration: 0.9, ease: "power2.inOut", immediateRender: false }, tResult - 0.5);

          // ---- 4a: an input, the exchange rate, saved as a version --------------------------------
          const tEx = at("exchange", 1, -0.1);
          wipe("#s4-source", tEx, 0.6);
          tl.fromTo("#s4-v1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: FILM.ease }, at("version", 1, -0.25));
          tl.fromTo("#s4-src-cap", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: FILM.ease }, at("version", 1, -0.1));

          // ---- 4b: a tool reads it, and leaves a receipt ------------------------------------------
          FILM.drawThread(tl, "#s4-th-a", at("reads", 1, -0.25), { duration: 0.6 });
          wipe("#s4-receipt", tTool, 0.55, 60);
          show("#s4-lbl-a", at("reads", 1, 0.2));
          tl.fromTo("#s4-slip", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.4)" }, at("receipt", 1, -0.1));

          // ---- 4c: the receipt points to its result; each number points to that result ------------
          FILM.drawThread(tl, "#s4-th-b", at("points", 1, -0.1), { duration: 0.6 });
          show("#s4-lbl-b", at("points", 1, 0.3));
          wipe("#s4-artifact", tResult, 0.55);
          const tEach = at("each");
          tl.fromTo(["#s4-company", "#s4-eu"], { opacity: 0, x: 48 }, { opacity: 1, x: 0, duration: 0.7, ease: "expo.out", stagger: 0.14 }, tEach - 0.1);
          const tThat = at("result", 2, -0.35);
          FILM.drawThread(tl, "#s4-th-c", tThat, { duration: 0.6 });
          FILM.drawThread(tl, "#s4-th-d", tThat + 0.08, { duration: 0.6 });
          show(["#s4-so-c", "#s4-so-d"], tThat + 0.5, 0.15);
          // the support result: a separate input to both reports
          const tSup = tThat + 0.55;
          tl.fromTo("#s4-support", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: FILM.ease }, tSup);
          FILM.drawThread(tl, "#s4-th-e", tSup + 0.35, { duration: 0.6 });
          FILM.drawThread(tl, "#s4-th-f", tSup + 0.43, { duration: 0.6 });
          show(["#s4-so-e", "#s4-so-f"], tSup + 0.9, 0.15);

          // ---- 4d: correct the rate ---------------------------------------------------------------
          const tFix = FILM.mark("correction", S).localStart;
          const tCorrect = at("correct", 1, -0.05);
          tl.fromTo("#s4-v1", { x: 0, y: 0, opacity: 1 }, { x: 0, y: 0, opacity: 0.4, duration: 0.5, ease: FILM.ease, immediateRender: false }, tCorrect);
          tl.fromTo("#s4-v2", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, tCorrect + 0.05);
          show("#s4-src-ring", tCorrect + 0.1, 0.35);
          void tFix;

          // ---- 4e: the change travels up those links ----------------------------------------------
          const hop = 0.42;
          const t0 = at("travels", 1, -0.15);
          const hopTo = (stalePath, base, dot, t, d = hop) => {
            FILM.drawThread(tl, stalePath, t, { duration: d, ease: "power1.inOut" });
            FILM.pulseAlong(tl, base, dot, t, { duration: d });
          };
          hopTo("#s4-st-a", "#s4-th-a", "#s4-p1", t0);
          show(["#s4-rc-hatch", "#s4-rc-ring"], t0 + hop - 0.05, 0.25);
          hopTo("#s4-st-b", "#s4-th-b", "#s4-p2", t0 + hop);
          show(["#s4-ar-hatch", "#s4-ar-ring"], t0 + 2 * hop - 0.05, 0.25);
          hopTo("#s4-st-c", "#s4-th-c", "#s4-p3", t0 + 2 * hop, hop + 0.06);
          hopTo("#s4-st-d", "#s4-th-d", "#s4-p4", t0 + 2 * hop, hop + 0.06);
          show(["#s4-co-ring", "#s4-eu-ring"], t0 + 3 * hop, 0.25);
          // both revenue figures are withheld, never shown stale
          const tWith = at("withheld", 1, -0.15);
          FILM.withhold(tl, "#s4-co-fig", tWith, { fromWidth: 100, toWidth: 72 });
          FILM.withhold(tl, "#s4-eu-fig", tWith + 0.08, { fromWidth: 100, toWidth: 72 });
          pop("#s4-tag-wc", tWith + 0.1);
          pop("#s4-tag-we", tWith + 0.18);

          // ---- 4f: support never read the rate, so it stays ---------------------------------------
          const tSupport = at("support", 1, -0.05);
          show("#s4-su-ringf", tSupport, 0.35);
          pop("#s4-tag-cur", tSupport + 0.05);
          const coRows = FILM.outline(tl, "#s4-company", { x: 22, y: 176, w: 326, h: 48 }, at("stays", 1, -0.1));
          const euRows = FILM.outline(tl, "#s4-eu", { x: 22, y: 176, w: 326, h: 48 }, at("stays", 1, -0.02));
          coRows.classList.add("fresh");
          euRows.classList.add("fresh");

          // ---- 4g: refresh re-runs only the affected steps ----------------------------------------
          const r0 = at("refresh", 1, -0.05);
          hide([coRows, euRows], r0, 0.3);
          hide("#s4-src-ring", r0, 0.3);
          show("#s4-src-ringf", r0, 0.3);
          tl.fromTo("#s4-v2c", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, r0);
          const rHop = 0.4;
          const refreshTo = (freshPath, base, dot, t, d = rHop) => {
            FILM.drawThread(tl, freshPath, t, { duration: d, ease: "power1.inOut" });
            FILM.pulseAlong(tl, base, dot, t, { duration: d });
          };
          refreshTo("#s4-fr-a", "#s4-th-a", "#s4-f1", r0);
          const tRc = r0 + rHop - 0.05;
          hide(["#s4-rc-hatch", "#s4-rc-ring", "#s4-rc-a"], tRc, 0.25);
          show(["#s4-rc-ringf", "#s4-rc-b"], tRc, 0.3);
          tl.fromTo("#s4-slip", { opacity: 1 }, { opacity: 0.5, duration: 0.3, ease: "power1.out", immediateRender: false }, tRc);
          tl.fromTo("#s4-slip2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" }, tRc);
          refreshTo("#s4-fr-b", "#s4-th-b", "#s4-f2", r0 + rHop);
          const tAr = r0 + 2 * rHop - 0.05;
          hide(["#s4-ar-hatch", "#s4-ar-ring", "#s4-ar-a"], tAr, 0.25);
          show(["#s4-ar-ringf", "#s4-ar-b"], tAr, 0.3);
          refreshTo("#s4-fr-c", "#s4-th-c", "#s4-f3", r0 + 2 * rHop, rHop + 0.06);
          refreshTo("#s4-fr-d", "#s4-th-d", "#s4-f4", r0 + 2 * rHop, rHop + 0.06);
          const tCards = r0 + 3 * rHop + 0.02;
          hide(["#s4-co-ring", "#s4-eu-ring", "#s4-tag-wc", "#s4-tag-we"], tCards, 0.25);
          show(["#s4-co-ringf", "#s4-eu-ringf"], tCards, 0.3);
          FILM.restore(tl, "#s4-co-fig", tCards, { fromWidth: 72, toWidth: 100 });
          FILM.restore(tl, "#s4-eu-fig", tCards + 0.06, { fromWidth: 72, toWidth: 100 });
          const money = (v) => "$" + Math.round(v).toLocaleString("en-US");
          FILM.countTo(tl, "#s4-co-fig .fig-v", 5565, 5755, tCards, { duration: 0.9, format: money });
          FILM.countTo(tl, "#s4-eu-fig .fig-v", 2090, 2280, tCards + 0.06, { duration: 0.9, format: money });
          pop("#s4-tag-fc", tCards + 0.15);
          pop("#s4-tag-fe", tCards + 0.22);
          // support kept its identity: reused, not re-run
          hide("#s4-tag-cur", tCards + 0.3, 0.2);
          pop("#s4-tag-reu", tCards + 0.35);
          // the summary line
          const tFoot = Math.min(end - 1.5, Math.max(tCards + 0.9, FILM.atEnd(S, "steps") + 0.1));
          tl.fromTo("#s4-foot", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: FILM.ease }, tFoot);

          // Several fromTo tweens share an element and property (fade in, later fade out; withhold, later
          // restore). Each renders its start state when created, so the last one built would win before any
          // of them begins. One pass to the end and back leaves every element in its earliest start state.
          tl.progress(1, false).progress(0, false);
          window.__timelines["s4-how"] = tl;
        })();
      </script>
    </template>
