      </style>

      <div id="root" data-composition-id="s7-results" data-width="1920" data-height="1080" data-duration="31.5">
        <h1 id="s7-title" class="s7-title t-head"><span class="s7-w">Does</span> <span class="s7-w">it</span> <span class="s7-w">work?</span></h1>

        <!-- A: the real-model study -->
        <div id="s7-a" class="s7-block s7-a">
          <p id="s7-a-eye" class="t-small s7-eyebrow">Frozen study · real model · 48 invocations</p>

        <!-- B: input exposure, full context vs ProofFlow, one scale -->

          <p id="s7-b-eye" class="t-small s7-eyebrow">Model input, same study</p>
          <p id="s7-b-l1" class="t-small s7-share-l">Full context</p>
          <div class="s7-share">
            <svg class="s7-bars" width="400" height="28" viewBox="0 0 400 28">
              <path id="s7-b-full" class="s7-full" d="M0 14 H400" />

          </div>
          <p id="s7-b-l2" class="t-small s7-share-l s7-pf">ProofFlow</p>
          <div class="s7-share">
            <svg class="s7-bars" width="400" height="28" viewBox="0 0 400 28">
              <path id="s7-b-pf" class="s7-fill-pf" d="M0 14 H157.32" />
            </svg>
            <span id="s7-b-v" class="t-sub s7-share-v">39.33%</span>

        <!-- C: the retail benchmark -->

          <div id="s7-c-fig" class="t-head s7-fig2 s7-stretch"><span id="s7-c-num">38</span><span class="s7-of">/38</span></div>
          <p id="s7-c-lab" class="t-label s7-label"><span id="s7-c-pct" class="s7-pct">69.41%</span> fewer evidence tokens</p>
          <p id="s7-c-sub" class="t-small">39,375 vs 128,729 for full context</p>

        <div id="s7-vr1" class="s7-vr" style="left: 762px"></div>

        <div id="s7-hr" class="s7-hr"></div>

        <!-- method chart -->
        <p id="s7-chart-h" class="t-small s7-chart-h">Affected reports refreshed, of 32 · same study, same evidence allowance</p>

        <div id="s7-r0" class="s7-row s7-r0">
          <p class="t-label s7-rl s7-rl-pf">ProofFlow</p>
          <svg class="s7-bars" width="880" height="28" viewBox="0 0 880 28">
            <path class="s7-track" d="M0 14 H880" />
            <path id="s7-r0-bar" class="s7-fill-pf" d="M0 14 H880" />
          </svg>
          <span id="s7-r0-v" class="s7-rv s7-rv-pf">32</span>
        </div>
        <div id="s7-r1" class="s7-row s7-r1">
          <p class="t-label s7-rl s7-rl-pf">Exact dependency walk</p>
          <svg class="s7-bars" width="880" height="28" viewBox="0 0 880 28">
            <path class="s7-track" d="M0 14 H880" />
            <path id="s7-r1-bar" class="s7-fill-pf" d="M0 14 H880" />

          <span id="s7-r1-v" class="s7-rv s7-rv-pf">32</span>
        </div>

          <p class="t-label s7-rl s7-rl-faint">Iterative hybrid</p>
          <svg class="s7-bars" width="880" height="28" viewBox="0 0 880 28">

            <path id="s7-r2-bar" class="s7-fill-faint" d="M0 14 H770" />
          </svg>

        </div>
        <div id="s7-r3" class="s7-row s7-r3">
          <p class="t-label s7-rl">Keyword search<span class="t-mono">BM25</span></p>
          <svg class="s7-bars" width="880" height="28" viewBox="0 0 880 28">
            <path class="s7-track" d="M0 14 H880" />
            <path id="s7-r3-bar" class="s7-fill-dim" d="M0 14 H687.5" />
          </svg>
          <span id="s7-r3-v" class="s7-rv s7-rv-dim">25</span>
        </div>
        <div id="s7-r4" class="s7-row s7-r4">
          <p class="t-label s7-rl">Vector search<span class="t-mono">BGE</span></p>
          <svg class="s7-bars" width="880" height="28" viewBox="0 0 880 28">
            <path class="s7-track" d="M0 14 H880" />
            <path id="s7-r4-bar" class="s7-fill-dim" d="M0 14 H137.5" />
          </svg>
          <span id="s7-r4-v" class="s7-rv s7-rv-dim">5</span>
        </div>

        <!-- bar ends sit at x = 120 + 420 + 880 = 1420; row 0 bar centre y = 674, row 1 bar centre y = 732 -->
        <svg class="s7-tie" viewBox="0 0 1920 1080">
          <path id="s7-level" class="s7-level" d="M1421 648 V758" />
          <path id="s7-brk" d="M1500 662 H1516 V744 H1500" />
        </svg>
        <div id="s7-brk-l" class="s7-brk-l">
          <p class="t-label">Explicit dependencies</p>
          <p class="t-small">both 32/32 · 38/38</p>

        <p id="s7-src" class="t-mono s7-src">docs/MODEL_COMPARISON_RESULTS.md · docs/RETAIL_V2_RESULTS.md</p>
      </div>

      <script>
        (() => {
          const S = "s7";
          const tl = gsap.timeline({ paused: true });
          const zero = FILM.section(S).start;

          /* A spoken number may be one token ("thirty-two") or two ("thirty two"): try each spelling. */
          const at = (spellings, offset = 0) => {
            for (const text of [].concat(spellings)) {
              try {
                return FILM.at(S, text, 1, offset);
              } catch (error) {
                /* try the next spelling */
              }
            }
            throw new Error(`[s7] none of ${[].concat(spellings).join(" | ")} is spoken in s7`);
          };
          /* The first time a word is spoken after a given section-local time. */
          const atAfter = (text, after, offset = 0) => {
            const want = String(text).toLowerCase().replace(/[^a-z0-9]+/g, "");
            const hit = FILM.words(S).find(
              (w) => w.start - zero >= after - 1e-6 && String(w.w).toLowerCase().replace(/[^a-z0-9]+/g, "") === want,
            );
            if (!hit) throw new Error(`[s7] "${text}" is not spoken after ${after}s`);
            return Math.max(0, Math.round((hit.start - zero + offset) * 1000) / 1000);
          };
          const L = (id) => FILM.line(id);
          const fade = (target, position, from = {}, duration = 0.6, ease = FILM.ease) =>
            tl.fromTo(target, { opacity: 0, ...from }, { opacity: 1, x: 0, y: 0, duration, ease }, position);
          const stretch = (target, position, from, to, duration = 0.8) =>
            tl.fromTo(target, { "--s7-wd": from }, { "--s7-wd": to, duration, ease: "expo.out" }, position);

          /* 7a: "Does it work?" each word stretches in on its spoken time */
          const words = [...document.querySelectorAll("#s7-title .s7-w")];
          const spoken = ["does", "it", "work"];
          words.forEach((span, index) => {
            const time = at(spoken[index], -0.06);
            tl.fromTo(span, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, time);
            stretch(span, time, 60, 125, 0.7);
          });

          /* 7b: the real-model study. Eyebrow on "frozen", 32/32 counts and stretches on "thirty-two". */
          fade("#s7-a-eye", at("frozen", -0.05), { x: -24 });
          const t32 = at(["thirty-two", "thirty two", "32"], -0.08);
          tl.fromTo("#s7-a-fig", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, t32);
          stretch("#s7-a-fig", t32, 60, 112, 0.9);
          FILM.countTo(tl, "#s7-a-num", 0, 32, t32, { duration: 0.9 });
          fade("#s7-a-lab", t32 + 0.35, { y: 14 }, 0.5);

          /* "matching full context": the full-context bar is the scale; "under forty percent": ProofFlow's share */
          const tMatch = at("matching", -0.05);
          tl.fromTo("#s7-vr1", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.7, ease: "power2.inOut" }, tMatch - 0.1);
          fade("#s7-b-eye", tMatch, { x: -18 }, 0.5);
          fade("#s7-b-l1", tMatch + 0.1, { x: -18 }, 0.5);
          FILM.drawThread(tl, "#s7-b-full", tMatch + 0.15, { duration: 0.8, ease: "power2.inOut" });
          const tUnder = at("under", -0.05);
          fade("#s7-b-l2", tUnder, { x: -18 }, 0.5);
          FILM.drawThread(tl, "#s7-b-pf", tUnder + 0.1, { duration: 0.6, ease: "power3.out" });
          tl.fromTo("#s7-b-v", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, tUnder + 0.35);
          FILM.countTo(tl, "#s7-b-v", 0, 39.33, tUnder + 0.35, { duration: 0.8, format: (v) => `${v.toFixed(2)}%` });
          fade("#s7-b-cap", tUnder + 0.6, { y: 12 }, 0.5);

          /* 7c: the method chart. ProofFlow's 32 is laid down as the line starts; keyword search to 25, vector to 5.
             Rows below ProofFlow start one row higher: the exact dependency walk slides into that gap in 7e. */
          const pitch = 58;
          const t7c = Math.max(L("7c").localStart - 0.35, tUnder + 1.2);
          tl.fromTo("#s7-hr", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, t7c - 0.2);
          fade("#s7-chart-h", t7c, { y: 10 }, 0.5);
          fade("#s7-r0", t7c, { x: -24 }, 0.5);
          FILM.drawThread(tl, "#s7-r0-bar", t7c + 0.1, { duration: 0.8, ease: "power3.out" });
          tl.fromTo("#s7-r0-v", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t7c + 0.6);

          /* the strongest search baseline, faint but present: iterative hybrid 28 */
          const tHyb = t7c + 0.25;
          tl.fromTo("#s7-r2", { opacity: 0, x: -24, y: -pitch }, { opacity: 1, x: 0, y: -pitch, duration: 0.5, ease: FILM.ease }, tHyb);
          FILM.drawThread(tl, "#s7-r2-bar", tHyb + 0.1, { duration: 0.7, ease: "power3.out" });
          tl.fromTo("#s7-r2-v", { opacity: 0 }, { opacity: 1, duration: 0.3 }, tHyb + 0.6);

          const tKey = Math.max(at("keyword", -0.05), tHyb + 0.2);
          tl.fromTo("#s7-r3", { opacity: 0, x: -24, y: -pitch }, { opacity: 1, x: 0, y: -pitch, duration: 0.5, ease: FILM.ease }, tKey);
          const t25 = at(["twenty-five", "twenty five", "25"], 0);
          FILM.drawThread(tl, "#s7-r3-bar", tKey + 0.15, { duration: Math.max(0.6, t25 + 0.3 - (tKey + 0.15)), ease: "power2.out" });
          tl.fromTo("#s7-r3-v", { opacity: 0 }, { opacity: 1, duration: 0.25 }, Math.max(tKey + 0.5, t25 + 0.1));

          const tVec = at("vector", -0.05);
          const t5 = atAfter("five", tVec);
          tl.fromTo("#s7-r4", { opacity: 0, x: -24, y: -pitch }, { opacity: 1, x: 0, y: -pitch, duration: 0.5, ease: FILM.ease }, tVec);
          FILM.drawThread(tl, "#s7-r4-bar", Math.max(tVec + 0.2, t5 - 0.25), { duration: 0.45, ease: "power2.out" });
          tl.fromTo("#s7-r4-v", { opacity: 0 }, { opacity: 1, duration: 0.25 }, t5 + 0.05);

          /* 7d: the retail benchmark. Eyebrow on "retail", 38/38 on "thirty-eight", 69.41% on "sixty-nine". */
          const tRetail = at("retail", -0.1);
          tl.fromTo("#s7-vr2", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.7, ease: "power2.inOut" }, tRetail - 0.1);
          fade("#s7-c-eye", tRetail, { x: -24 });
          const t38 = at(["thirty-eight", "thirty eight", "38"], -0.08);
          tl.fromTo("#s7-c-fig", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, t38);
          stretch("#s7-c-fig", t38, 60, 112, 0.9);
          FILM.countTo(tl, "#s7-c-num", 0, 38, t38, { duration: 0.9 });
          const t69 = at(["sixty-nine", "sixty nine", "69"], -0.05);
          fade("#s7-c-lab", t69, { y: 12 }, 0.5);
          FILM.countTo(tl, "#s7-c-pct", 0, 69.41, t69, { duration: 0.8, format: (v) => `${v.toFixed(2)}%` });
          fade("#s7-c-sub", at("evidence", 0.1), { y: 10 }, 0.5);

          /* 7e: "A plain dependency walk ties it." The rows below make room, the walk slides in level with ProofFlow and
             its bar lands on "ties"; a level mark joins the two bar ends. "recording dependencies": one bracket. */
          const tPlain = at("plain", -0.1);
          tl.fromTo(["#s7-r2", "#s7-r3", "#s7-r4"], { y: -pitch }, { y: 0, duration: 0.6, ease: "power3.inOut", immediateRender: false }, tPlain);
          tl.fromTo("#s7-r1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: FILM.ease }, tPlain + 0.2);
          const tTies = at("ties", 0);
          const barStart = tPlain + 0.35;
          FILM.drawThread(tl, "#s7-r1-bar", barStart, { duration: Math.max(0.6, tTies + 0.15 - barStart), ease: "power2.out" });
          tl.fromTo("#s7-r1-v", { opacity: 0 }, { opacity: 1, duration: 0.25 }, Math.max(barStart + 0.5, tTies + 0.1));
          FILM.drawThread(tl, "#s7-level", Math.max(barStart + 0.6, tTies + 0.2), { duration: 0.35, ease: "power2.out" });

          const tRec = at("recording", -0.05);
          FILM.drawThread(tl, "#s7-brk", tRec, { duration: 0.6, ease: "power2.inOut" });
          fade("#s7-brk-l", tRec + 0.3, { x: -18 }, 0.6);
          fade("#s7-src", at("dependencies", 0.1), { y: 8 }, 0.6);

          window.__timelines["s7-results"] = tl;
        })();
      </script>
    </template>
  </body>
