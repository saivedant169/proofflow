      <script>
        (() => {
          const S = "s2";
          const tl = gsap.timeline({ paused: true });
          const rootStyle = getComputedStyle(document.documentElement);
          const tok = (name) => rootStyle.getPropertyValue(name).trim();
          const at = (text, nth = 1, offset = 0) => FILM.at(S, text, nth, offset);
          const atEnd = (text, nth = 1, offset = 0) => FILM.atEnd(S, text, nth, offset);
          const L = { a: FILM.line("2a"), b: FILM.line("2b"), c: FILM.line("2c"), d: FILM.line("2d") };
          const SVGNS = "http://www.w3.org/2000/svg";
          const cx = (n) => n.x + n.w / 2;
          const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
          const edgeD = (a, b) => {
            const x1 = clamp(cx(a) + (cx(b) - cx(a)) * 0.22, a.x + 22, a.x + a.w - 22);
            const x2 = clamp(cx(b) + (cx(a) - cx(b)) * 0.22, b.x + 22, b.x + b.w - 22);
            const y1 = a.y, y2 = b.y + b.h, my = (y1 + y2) / 2;
            return `M${x1} ${y1} C${x1} ${my} ${x2} ${my} ${x2} ${y2}`;
          };
          const svgPath = (svg, d, cls) => {
            const p = document.createElementNS(SVGNS, "path");
            p.setAttribute("d", d);
            if (cls) p.setAttribute("class", cls);
            svg.appendChild(p);
            return p;
          };
          /** A static outline, drawn exactly as FILM.outline draws it at its end (s1's last frame). */
          const staticOutline = (host, rect, cls, grow = 8, radius = 20) => {
            const svg = document.createElementNS(SVGNS, "svg");
            svg.setAttribute("class", cls);
            const w = rect.w + grow * 2, h = rect.h + grow * 2;
            svg.setAttribute("width", String(w));
            svg.setAttribute("height", String(h));
            svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
            svg.style.left = `${rect.x - grow}px`;
            svg.style.top = `${rect.y - grow}px`;
            const r = document.createElementNS(SVGNS, "rect");
            r.setAttribute("x", "1.5");
            r.setAttribute("y", "1.5");
            r.setAttribute("width", String(w - 3));
            r.setAttribute("height", String(h - 3));
            r.setAttribute("rx", String(radius));
            svg.appendChild(r);
            host.appendChild(svg);
            return svg;
          };

/*@@SHARED_JS@@*/
          /* ================= SHARED with s1 (copied): the two lanes, built at their final state ================= */
          const buildDuel = (P, host) => {
            const add = (tag, cls, css, html) => {
              const el = document.createElement(tag);
              if (cls) el.className = cls;
              if (css) el.style.cssText = css;
              if (html != null) el.innerHTML = html;
              host.appendChild(el);
              return el;
            };
            const R = {};
            // the agent at the top, forking into two lanes
            R.fork = document.createElementNS(SVGNS, "svg");
            R.fork.setAttribute("class", "threads");
            R.fork.setAttribute("viewBox", "0 0 1920 1080");
            host.appendChild(R.fork);
            R.forkL = svgPath(R.fork, "M960 196 C960 262 510 236 510 300");
            R.forkR = svgPath(R.fork, "M960 196 C960 262 1410 236 1410 300");
            R.agent = add("div", `node pill ${P}-agent`, "left:820px;top:96px;width:280px;height:100px;", '<span class="node-title">AI agent</span>');
            R.ruleL = add("div", `${P}-lrule`, "left:120px;");
            R.ruleR = add("div", `${P}-lrule`, "left:1020px;");
            R.divider = add("div", `${P}-divider`);

            // ---- left lane: re-read everything ----
            R.nameL = add("div", `${P}-lname`, "left:120px;",
              `<svg class="${P}-icon" viewBox="0 0 40 40"><rect x="9" y="4" width="22" height="28" rx="3" /><path d="M4 10 V36 H26" /></svg><span class="t-sub-s">Re-read everything</span>`);
            R.docs = [];
            for (let i = 0; i < 5; i += 1) {
              const bars = [0.9, 0.7, 0.85, 0.6, 0.8, 0.5, 0.75].map((w) => `<i style="width:${w * 100}%"></i>`).join("");
              R.docs.push(add("div", `${P}-doc`, `left:${640 + (4 - i) * 14}px;top:${500 - (4 - i) * 14}px;`, bars));
            }
            R.win = add("div", `panel ${P}-win`);
            R.winLabel = add("p", `t-small ${P}-cap`, "left:160px;top:812px;", "Agent context");
            let seed = 11;
            const rnd = () => {
              seed = (seed * 16807) % 2147483647;
              return (seed - 1) / 2147483646;
            };
            R.rows = [];
            for (let i = 0; i < 20; i += 1) {
              const row = add("div", `${P}-row`, `top:${776 - i * 20}px;`);
              let x = 0;
              const segs = 1 + Math.floor(rnd() * 3);
              const total = 170 + rnd() * 186;
              for (let s = 0; s < segs; s += 1) {
                const w = Math.max(36, total / segs - 12 + (rnd() - 0.5) * 40);
                if (x + w > 356) break;
                const bar = document.createElement("span");
                bar.className = `${P}-bar`;
                bar.style.left = `${x}px`;
                bar.style.width = `${w}px`;
                row.appendChild(bar);
                x += w + 12;
              }
              R.rows.push(row);
            }
            const meter = (left, filled, dollars) => {
              const out = { segs: [], dollars: [] };
              out.tokLabel = add("p", `t-small ${P}-cap`, `left:${left}px;top:866px;`, "Tokens");
              for (let i = 0; i < 13; i += 1) {
                const seg = add("div", `${P}-seg`, `left:${left + i * 20}px;`, i < filled ? "<i></i>" : "");
                out.segs.push(seg);
              }
              out.costLabel = add("p", `t-small ${P}-cap`, `left:${left + 300}px;top:866px;`, "Cost");
              for (let i = 0; i < dollars; i += 1) out.dollars.push(add("span", `${P}-dollar`, `left:${left + 300 + i * 35}px;`, "$"));
              return out;
            };
            R.meterL = meter(120, 13, 8);
            R.accurate = add("span", `tag tag-current ${P}-cap`, "left:712px;top:900px;", "Accurate");

            // ---- right lane: search for what looks related ----
            R.nameR = add("div", `${P}-lname`, "left:1020px;",
              `<svg class="${P}-icon" viewBox="0 0 40 40"><circle cx="17" cy="17" r="11" /><line x1="25" y1="25" x2="35" y2="35" /></svg><span class="t-sub-s">Search what looks related</span>`);
            R.pill = add("div", `${P}-pill`, "",
              `<svg viewBox="0 0 30 30"><circle cx="12" cy="12" r="8.5" /><line x1="18.5" y1="18.5" x2="27" y2="27" /></svg><span class="t-mono ${P}-query">exchange rate</span>`);
            R.query = R.pill.lastElementChild;
            R.thr = document.createElementNS(SVGNS, "svg");
            R.thr.setAttribute("class", "threads");
            R.thr.setAttribute("viewBox", "0 0 1920 1080");
            host.appendChild(R.thr);
            R.net = {
              orders: { x: 1020, y: 780, w: 170, h: 60, src: true, html: "Orders" },
              eur: { x: 1230, y: 780, w: 250, h: 60, src: true, hot: true, html: `EUR→USD <span class="${P}-vflip"><span class="${P}-v-old ink">1.10</span><span class="${P}-v-new is-stale">1.20</span></span>` },
              tickets: { x: 1590, y: 780, w: 170, h: 60, src: true, html: "Tickets" },
              regional: { x: 1090, y: 640, w: 220, h: 60, html: "Regional USD" },
              response: { x: 1550, y: 640, w: 230, h: 60, html: `Response <span class="${P}-hw">rate</span>` },
              company: { x: 1060, y: 490, w: 280, h: 90, html: "Company total", fig: "$5,565" },
              review: { x: 1540, y: 490, w: 240, h: 90, html: `<span class="${P}-hw">Rate</span> review`, fig: "94%" },
            };
            R.netEdges = [["orders", "regional"], ["eur", "regional"], ["tickets", "response"], ["regional", "company"], ["response", "review"]];
            for (const [id, n] of Object.entries(R.net)) {
              n.el = add("div", `node ${P}-n${n.src ? " source" : ""}${n.hot ? ` ${P}-hot` : ""}`,
                `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;`,
                `<span class="node-sub">${n.html}</span>` + (n.fig ? `<span class="node-title">${n.fig}</span>` : ""));
              n.el.id = `${P}-rn-${id}`;
            }
            R.edgeEls = R.netEdges.map(([a, b]) => svgPath(R.thr, edgeD(R.net[a], R.net[b]), "base"));
            R.hits = [...host.getElementsByClassName(P + "-hw")];
            R.hits.forEach((h) => h.classList.add(`${P}-hit`));
            R.beam = add("div", `${P}-beam`);
            R.missed = add("span", `tag tag-stale ${P}-missed`, "", "Missed");
            R.meterR = meter(1020, 2, 1);
            const box = (n) => ({ x: n.x, y: n.y, w: n.w, h: n.h });
            R.found = [box(R.net.review), box(R.net.response)];
            R.miss = box(R.net.company);
            return R;
          };
          /* ================= end SHARED ================= */
/*@@END_SHARED_JS@@*/

          /* ---------- t = 0: s1's last frame ---------- */
          const duel = document.getElementById("s2-duel");
          const world = document.getElementById("s2-world");
          const edgeSvg = document.getElementById("s2-edges");
          const R = buildDuel("s2", duel);
          staticOutline(duel, R.found[0], "hl");
          staticOutline(duel, R.found[1], "hl");
          staticOutline(duel, R.miss, "hl stale");
          tl.fromTo(R.beam, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

          /* ---------- the whole network (world coordinates) ---------- */
          const N = {
            refunds: { x: 230, y: 800, w: 170, h: 60, tier: 0, src: true, html: "Refunds" },
            orders: { x: 470, y: 800, w: 170, h: 60, tier: 0 },
            eur: { x: 720, y: 800, w: 250, h: 60, tier: 0 },
            regions: { x: 1040, y: 800, w: 170, h: 60, tier: 0, src: true, html: "Regions" },
            tickets: { x: 1420, y: 800, w: 170, h: 60, tier: 0 },
            refundTotal: { x: 300, y: 650, w: 200, h: 60, tier: 1, html: "Refund total" },
            regional: { x: 770, y: 650, w: 220, h: 60, tier: 1 },
            support: { x: 1170, y: 650, w: 170, h: 60, tier: 1, html: "Support" },
            response: { x: 1440, y: 650, w: 230, h: 60, tier: 1 },
            company: { x: 470, y: 480, w: 280, h: 90, tier: 2 },
            eu: { x: 960, y: 480, w: 220, h: 90, tier: 2, html: "EU brief", fig: "$2,090" },
            review: { x: 1440, y: 480, w: 240, h: 90, tier: 2 },
            deck: { x: 500, y: 330, w: 220, h: 64, tier: 3, html: "Board deck" },
            weekly: { x: 1180, y: 330, w: 220, h: 64, tier: 3, html: "Weekly recap" },
          };
          const E = [
            ["refunds", "refundTotal"], ["orders", "regional"], ["eur", "regional"], ["regions", "regional"],
            ["tickets", "support"], ["tickets", "response"], ["refundTotal", "company"], ["regional", "company"],
            ["regional", "eu"], ["support", "eu"], ["response", "review"], ["company", "deck"], ["eu", "weekly"], ["review", "weekly"],
          ];
          const AFFECTED = ["regional", "company", "eu", "deck", "weekly"];
          const TRUE_PATH = new Set(["eur>regional", "regional>company", "regional>eu", "company>deck", "eu>weekly"]);
          const MOVED = Object.keys(R.net);
          for (const [id, n] of Object.entries(N)) {
            if (MOVED.includes(id)) {
              // the s1 node itself moves into its place in the network
              const lane = R.net[id];
              n.el = lane.el;
              n.el.style.left = `${n.x}px`;
              n.el.style.top = `${n.y}px`;
              n.dx = lane.x - n.x;
              n.dy = lane.y - n.y;
              world.appendChild(n.el);
              continue;
            }
            const el = document.createElement("div");
            el.id = `s2-n-${id}`;
            el.className = `node s2-n${n.src ? " source" : ""}`;
            el.style.cssText = `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;`;
            el.innerHTML = `<span class="node-sub">${n.html}</span>` + (n.fig ? `<span class="node-title">${n.fig}</span>` : "");
            world.appendChild(el);
            n.el = el;
          }
          const edges = E.map(([p, c]) => {
            const d = edgeD(N[p], N[c]);
            const key = `${p}>${c}`;
            return { p, c, key, base: svgPath(edgeSvg, d, "base"), lit: svgPath(edgeSvg, d, ""), hot: TRUE_PATH.has(key) ? svgPath(edgeSvg, d, "stale") : null };
          });
          const edge = (key) => edges.find((e) => e.key === key);

          /* ---------- 2a: pull back into the network ---------- */
          const tA = Math.max(0.05, at("Agents", 1, -0.15));
          tl.fromTo(duel, { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.in" }, tA);
          // the search marks clear: "rate" goes back to plain ink, the rate back to its old value
          R.hits.forEach((h) => tl.fromTo(h, { color: tok("--thread-strong") }, { color: tok("--ink"), duration: 0.4, ease: "none" }, tA));
          const eurEl = N.eur.el;
          const vOld = eurEl.querySelector(".s2-v-old");
          const vNew = eurEl.querySelector(".s2-v-new");
          tl.fromTo(vNew, { y: 0, opacity: 1 }, { y: 30, opacity: 0, duration: 0.35, ease: "power2.in" }, tA + 0.1);
          tl.fromTo(vOld, { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, tA + 0.35);
          tl.fromTo(eurEl, { borderColor: tok("--stale") }, { borderColor: tok("--thread"), duration: 0.4, ease: "none" }, tA + 0.1);
          for (const id of MOVED) {
            const n = N[id];
            tl.fromTo(n.el, { x: n.dx, y: n.dy }, { x: 0, y: 0, duration: 1.15, ease: "power3.inOut" }, tA + 0.15 + n.tier * 0.06);
          }
          // the rest of the saved work assembles around them, each tier built on the one beneath
          const tierAt = [at("reports", 1, 0.1), at("own", 1, 0.05), at("earlier", 1, 0.05), at("work", 1, 0.05)];
          for (const [id, n] of Object.entries(N)) {
            if (MOVED.includes(id)) continue;
            tl.fromTo(n.el, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: FILM.ease }, tierAt[n.tier] + (n.x - 200) * 0.00012);
          }
          for (const e of edges) FILM.drawThread(tl, e.base, Math.max(tierAt[N[e.c].tier], tA + 1.2) + 0.12, { duration: 0.55, ease: "power2.out" });
          // "depends on inputs underneath": every dependency lights, from the inputs up
          const tLit = at("depends", 1, -0.05);
          const hop = clamp((atEnd("underneath") - tLit) / 3.2, 0.28, 0.5);
          for (const e of edges) FILM.drawThread(tl, e.lit, tLit + N[e.p].tier * hop, { duration: hop + 0.15, ease: "power1.inOut" });
          for (const n of Object.values(N)) {
            if (n.tier === 0) continue;
            tl.fromTo(n.el, { borderColor: tok("--rule") }, { borderColor: tok("--thread"), duration: 0.3, ease: "power1.out" }, tLit + n.tier * hop);
          }

          /* ---------- 2b: correct one exchange rate; some numbers are now wrong ---------- */
          const tFix = at("exchange", 1, 0);
          tl.fromTo(vOld, { y: 0, opacity: 1 }, { y: -30, opacity: 0, duration: 0.35, ease: "power3.in", immediateRender: false }, tFix);
          tl.fromTo(vNew, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, tFix + 0.15);
          tl.fromTo(eurEl, { borderColor: tok("--thread") }, { borderColor: tok("--stale"), duration: 0.3, ease: "none", immediateRender: false }, tFix + 0.15);
          const eurHl = FILM.outline(tl, "#s2-marks", N.eur, at("rate", 1, 0), { grow: 8, radius: 20 });
          eurHl.setAttribute("class", "hl stale");
          const tWrong = at("some", 1, 0);
          AFFECTED.forEach((id, i) => {
            const n = N[id];
            const t = tWrong + i * 0.22;
            tl.set(n.el, { borderStyle: "dashed" }, t);
            tl.fromTo(n.el, { borderColor: tok("--thread") }, { borderColor: tok("--unknown"), duration: 0.3, ease: "none", immediateRender: false }, t);
          });

          /* ---------- 2c: a total can depend on the rate without ever mentioning it ---------- */
          const tTotal = at("total", 1, -0.1);
          const FOCUS = new Set(["eur", "regional", "company"]);
          const dimmed = Object.entries(N).filter(([id]) => !FOCUS.has(id)).map(([, n]) => n.el);
          tl.fromTo(dimmed, { opacity: 1 }, { opacity: 0.28, duration: 0.5, ease: "power1.out", immediateRender: false }, tTotal);
          tl.fromTo(edges.filter((e) => !(e.key === "eur>regional" || e.key === "regional>company")).flatMap((e) => [e.base, e.lit]),
            { opacity: 1 }, { opacity: 0.25, duration: 0.5, ease: "power1.out" }, tTotal);
          tl.fromTo(eurHl, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "none" }, tTotal);
          FILM.drawThread(tl, "#s2-callout-path", tTotal + 0.1, { duration: 0.5, ease: "power2.inOut" });
          tl.fromTo("#s2-card", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: FILM.ease }, tTotal + 0.4);
          // "depend on that rate": the hidden thread runs from the rate straight up to the total
          const tDep = at("depend", 1, -0.05);
          const hidden = [edge("eur>regional"), edge("regional>company")];
          hidden.forEach((e, i) => {
            FILM.drawThread(tl, e.hot, tDep + i * 0.45, { duration: 0.45, ease: "power1.inOut" });
            FILM.pulseAlong(tl, e.hot, "#s2-pulse", tDep + i * 0.45, { duration: 0.45, ease: "none" });
          });
          tl.fromTo("#s2-pulse-gate", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, tDep);
          tl.fromTo("#s2-pulse-gate", { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none", immediateRender: false }, tDep + 0.91);
          // "without ever mentioning it": the search for "rate" in its text comes back empty
          tl.fromTo("#s2-nomatch", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: FILM.ease }, at("mentioning", 1, -0.1));

          /* ---------- 2d: similar words are not the same as real dependencies ---------- */
          const tD = L.d.localStart;
          tl.fromTo(["#s2-card", "#s2-callout"], { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.in", immediateRender: false }, tD - 0.45);
          tl.fromTo(dimmed, { opacity: 0.28 }, { opacity: 1, duration: 0.5, ease: "power1.out", immediateRender: false }, tD - 0.2);
          tl.fromTo(edges.filter((e) => !(e.key === "eur>regional" || e.key === "regional>company")).flatMap((e) => [e.base, e.lit]),
            { opacity: 0.25 }, { opacity: 1, duration: 0.5, ease: "power1.out", immediateRender: false }, tD - 0.2);
          FILM.speakWords(tl, "#s2-h1-words", S);
          // "Similar words": the word matches get a marker, the way search sees them
          const tWords = at("words", 1, 0);
          R.hits.forEach((h, i) => {
            h.classList.add("s2-mark");
            tl.fromTo(h, { backgroundColor: "transparent", color: tok("--ink") },
              { backgroundColor: tok("--thread-soft"), color: tok("--thread-strong"), duration: 0.3, ease: "none", immediateRender: false }, tWords + i * 0.12);
          });
          [N.review, N.response].forEach((n, i) => FILM.outline(tl, "#s2-marks", n, tWords + 0.1 + i * 0.12, { grow: 8, radius: 20 }));
          // "not the same": the sign arrives, its slash cuts last
          const tNot = at("not", 1, -0.05);
          tl.fromTo("#s2-neq", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: FILM.ease }, tNot);
          FILM.drawThread(tl, "#s2-neq-slash", tNot + 0.2, { duration: 0.3, ease: "power2.out" });
          FILM.speakWords(tl, "#s2-h2-words", S);
          // "real dependencies": the true threads from the rate light, all the way up
          const tReal = at("dependencies", 1, -0.1);
          [["regional>eu", 0], ["company>deck", 1], ["eu>weekly", 1]].forEach(([key, k]) => {
            FILM.drawThread(tl, edge(key).hot, tReal + k * 0.4, { duration: 0.45, ease: "power1.inOut" });
          });

          window.__timelines["s2-problem"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
