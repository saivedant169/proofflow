<!doctype html>
<!-- ProofFlow film. The root only mounts: eight sections at the windows of timing.json, and the audio slots.
     All picture lives in compositions/s*.html; the look lives in film.css. tools/sync.mjs rewrites the
     data-start / data-duration values from timing.json and audio/words.json. See CONTRACT.md. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ProofFlow: film</title>
    <link rel="stylesheet" href="film.css" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="film-data.js"></script>
    <script src="film.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="film" data-start="0" data-width="1920" data-height="1080" data-duration="253.7">
      <div id="film-ground"></div>

      <div id="sec-s1" data-composition-id="s1-monday" data-composition-src="compositions/s1-monday.html" data-start="0" data-duration="21.2" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="sec-s2" data-composition-id="s2-problem" data-composition-src="compositions/s2-problem.html" data-start="21.2" data-duration="22.8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="sec-s3" data-composition-id="s3-idea" data-composition-src="compositions/s3-idea.html" data-start="44" data-duration="19.2" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="sec-s4" data-composition-id="s4-how" data-composition-src="compositions/s4-how.html" data-start="63.2" data-duration="34.7" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="sec-s5" data-composition-id="s5-product" data-composition-src="compositions/s5-product.html" data-start="97.9" data-duration="28.9" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="sec-s6" data-composition-id="s6-architecture" data-composition-src="compositions/s6-architecture.html" data-start="126.8" data-duration="62.1" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="sec-s7" data-composition-id="s7-results" data-composition-src="compositions/s7-results.html" data-start="188.9" data-duration="50.9" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="sec-s8" data-composition-id="s8-close" data-composition-src="compositions/s8-close.html" data-start="239.8" data-duration="13.9" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- biome-ignore-start lint/a11y/useMediaCaption: captions are one subtitle track for the whole film (audio/captions.vtt), muxed at finish; these audio slots are stems -->
      <audio id="vo-s1" src="audio/narration/s1.wav" data-start="0" data-duration="20.13" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-s2" src="audio/narration/s2.wav" data-start="21.2" data-duration="21.81" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-s3" src="audio/narration/s3.wav" data-start="44" data-duration="17.54" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-s4" src="audio/narration/s4.wav" data-start="63.2" data-duration="33.225" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-s5" src="audio/narration/s5.wav" data-start="97.9" data-duration="27.62" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-s6" src="audio/narration/s6.wav" data-start="126.8" data-duration="54.01" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-s7" src="audio/narration/s7.wav" data-start="188.9" data-duration="49.45" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-s8" src="audio/narration/s8.wav" data-start="239.8" data-duration="10.295" data-track-index="10" data-volume="1"></audio>
      <audio id="music-bed" src="audio/music-bed.wav" data-start="0" data-duration="253.7" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx-stem" src="audio/sfx.wav" data-start="0" data-duration="253.7" data-track-index="12" data-volume="1"></audio>
      <!-- biome-ignore-end lint/a11y/useMediaCaption: captions are one subtitle track for the whole film (audio/captions.vtt), muxed at finish; these audio slots are stems -->
    </div>
    <script>
      window.__timelines["film"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
